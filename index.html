<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دعوة عقد قران</title>

<!-- WhatsApp / social preview -->
<meta property="og:title" content="دعوة عقد قران">
<meta property="og:description" content="يوم الاثنين ٢٨ أيلول ٢٠٢٦ — قاعة Glamour Garden، عكار">
<meta property="og:image" content="poster.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#cdb192">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#cdb192;
  --ink:#5b4a37;
  --ink-soft:#7a6750;
  --card-scale:1.55;      /* how far we zoom into the card */
  --panel-cx:50%;         /* card panel centre inside the 9:16 stage */
  --panel-cy:48.7%;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);
  font-family:'Amiri',serif;
  color:var(--ink);
  overflow-x:hidden;
}

/* ---------- stage: a 9:16 box that always covers the screen ---------- */
.screen{position:relative;width:100%;height:100svh;overflow:hidden}
.stage{
  position:absolute;top:50%;left:50%;
  width:max(100vw, calc(100svh * 9 / 16));
  height:max(100svh, calc(100vw * 16 / 9));
  transform:translate(-50%,-50%);
}

/* ---------- the moving background (video, then still frame) ---------- */
.bg{
  position:absolute;inset:0;
  transform-origin:var(--panel-cx) var(--panel-cy);
  transition:transform 2.2s cubic-bezier(.22,.61,.36,1);
  will-change:transform;
}
.bg video,.bg img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;display:block;
}
.bg img{opacity:0;transition:opacity .45s linear}
.is-open .bg{transform:scale(var(--card-scale))}
.is-open .bg img{opacity:1}

/* ---------- the invitation text, laid over the zoomed card ---------- */
.panel{
  position:absolute;
  left:12%;width:76%;
  top:4.7%;height:88%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:2.2svh;
  padding:4svh 2svh;
  text-align:center;
  opacity:0;pointer-events:none;
}
.is-open .panel{pointer-events:auto}

.line{opacity:0;transform:translateY(14px);filter:blur(3px)}
.is-open .line{animation:rise .9s cubic-bezier(.22,.61,.36,1) forwards}
@keyframes rise{to{opacity:1;transform:none;filter:none}}
.is-open .panel{opacity:1}

.basmala{font-family:'Aref Ruqaa',serif;font-size:clamp(20px,4.6svh,44px);line-height:1.6}
.aya{
  font-size:clamp(15px,2.9svh,28px);
  color:var(--ink-soft);
  letter-spacing:.5px;
}
.small{font-size:clamp(13px,2.1svh,20px);color:var(--ink-soft)}
.families{
  display:flex;gap:clamp(14px,4vw,40px);
  align-items:flex-start;justify-content:center;
  font-size:clamp(14px,2.4svh,23px);line-height:1.9;
}
.families>div{flex:1;max-width:46%}
.families .sep{
  flex:0 0 1px;align-self:stretch;max-width:1px;
  background:linear-gradient(transparent,rgba(91,74,55,.35),transparent);
}
.logo{width:clamp(70px,15svh,140px);opacity:.92;margin:1svh 0}
.day{font-size:clamp(15px,2.6svh,25px)}
.dates{
  display:flex;align-items:center;justify-content:center;
  gap:clamp(10px,3vw,22px);
  font-size:clamp(14px,2.3svh,22px);
  direction:ltr;
}
.dates span.bar{opacity:.45}
.time{font-size:clamp(14px,2.3svh,22px)}

.rule{width:38%;height:1px;background:rgba(91,74,55,.28)}

/* ---------- scroll cue ---------- */
.cue{
  position:absolute;bottom:calc(2svh + env(safe-area-inset-bottom));
  left:0;right:0;text-align:center;
  font-size:14px;color:var(--ink-soft);
  opacity:0;transition:opacity .8s ease 1.2s;
}
.is-open .cue{opacity:.85}
.cue .arrow{display:block;margin-top:2px;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

/* ---------- controls ---------- */
.skip{
  position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;
  z-index:5;border:0;border-radius:999px;
  background:rgba(91,74,55,.18);color:#fff;
  backdrop-filter:blur(6px);
  font-family:inherit;font-size:13px;padding:7px 15px;cursor:pointer;
  transition:opacity .4s ease;
}
.is-open .skip{opacity:0;pointer-events:none}

/* ---------- details section ---------- */
.details{
  position:relative;
  min-height:100svh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:3svh;padding:10svh 8vw;text-align:center;
  background:var(--bg);
}
.details::before{
  content:"";position:absolute;inset:0;
  background:url('lastframe.jpg') center/cover no-repeat;
  transform:scale(1.9);
  opacity:.55;
}
.details>*{position:relative}
.venue-label{font-size:clamp(14px,2.2svh,20px);color:var(--ink-soft)}
.venue{
  font-family:'Aref Ruqaa',serif;
  font-size:clamp(22px,4svh,38px);line-height:1.5;
}
.venue .en{font-family:'Amiri',serif;font-style:italic;letter-spacing:1px}
.map{
  display:inline-block;margin-top:1svh;
  padding:13px 30px;border-radius:999px;
  border:1px solid rgba(91,74,55,.45);
  color:var(--ink);text-decoration:none;
  font-size:clamp(14px,2.2svh,19px);
  background:rgba(255,255,255,.22);
  backdrop-filter:blur(4px);
}
.dua{
  margin-top:4svh;
  font-family:'Aref Ruqaa',serif;
  font-size:clamp(16px,2.7svh,26px);
  line-height:2;color:var(--ink-soft);
  max-width:22ch;
}

@media (prefers-reduced-motion:reduce){
  .bg{transition:none}
  .line{animation:none!important;opacity:1;transform:none;filter:none}
  .cue .arrow{animation:none}
}
</style>
</head>

<body>

<section class="screen" id="screen">
  <button class="skip" id="skip">تخطّي</button>

  <div class="stage">
    <div class="bg" id="bg">
      <video id="vid" playsinline muted preload="auto" poster="poster.jpg">
        <source src="intro.mp4" type="video/mp4">
      </video>
      <img src="lastframe.jpg" alt="">
    </div>

    <div class="panel" id="panel">
      <div class="line" style="animation-delay:.15s"><div class="basmala">﷽</div></div>
      <div class="line" style="animation-delay:.45s"><div class="aya">﴿ وَأَلَّفَ بَيْنَ قُلُوبِهِمْ ﴾</div></div>

      <div class="line rule" style="animation-delay:.7s"></div>

      <div class="line small" style="animation-delay:.9s">تتشرّف</div>

      <div class="line families" style="animation-delay:1.1s">
        <div>عائلة<br>المرحوم فيصل سالم</div>
        <div class="sep"></div>
        <div>عائلة<br>السيد نبيل خضر</div>
      </div>

      <div class="line small" style="animation-delay:1.35s">بدعوتكم لحضور عقد قران نجليهما</div>

      <div class="line" style="animation-delay:1.6s">
        <img class="logo" src="logo.png" alt="">
      </div>

      <div class="line day" style="animation-delay:1.9s">يوم الاثنين</div>
      <div class="line dates" style="animation-delay:2.05s">
        <span>28-9-2026</span><span class="bar">|</span><span>16-4-1448</span>
      </div>
      <div class="line time" style="animation-delay:2.2s">الساعة ٥ عصراً</div>
    </div>

    <div class="cue">التفاصيل<span class="arrow">⌄</span></div>
  </div>
</section>

<section class="details">
  <div class="venue-label">وذلك في</div>
  <div class="venue">قاعة <span class="en">Glamour&nbsp;Garden</span><br>عكار — عديل</div>

  <!-- بدّل الرابط بالـ pin الدقيق من Google Maps -->
  <a class="map" target="_blank" rel="noopener"
     href="https://www.google.com/maps/search/?api=1&query=Glamour+Garden+Akkar+Lebanon">
     الموقع على الخريطة
  </a>

  <div class="dua">بارك الله لهما وبارك عليهما<br>وجمع بينهما في خير</div>
</section>

<script>
(function(){
  var screenEl = document.getElementById('screen');
  var vid = document.getElementById('vid');
  var skip = document.getElementById('skip');
  var opened = false;

  function open(){
    if(opened) return;
    opened = true;
    screenEl.classList.add('is-open');
    try{ vid.pause(); }catch(e){}
  }

  vid.addEventListener('ended', open);
  skip.addEventListener('click', open);

  // safety net: never leave the visitor stuck on the intro
  vid.addEventListener('error', open);
  setTimeout(function(){ if(!opened && vid.readyState < 2) open(); }, 6000);

  var p = vid.play();
  if(p && p.catch) p.catch(function(){ open(); });
})();
</script>

</body>
</html>
